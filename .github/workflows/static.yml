name: Build and Deploy

# Executa o workflow sempre que houver um push na branch principal (main)
on:
  push:
    branches:
      - main
  # Permite executar esse workflow manualmente pela aba "Actions"
  workflow_dispatch:

# Garante que o token do GitHub tenha permissão para escrever e criar commits na branch de deploy
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Instala as dependências do projeto
      - name: Install Dependencies
        run: npm ci

      # 4. Executa o comando de build (Gera a pasta 'dist' ou 'build')
      - name: Build Project
        run: npm run build

      # 5. Faz o Deploy dos arquivos compilados para a branch alvo
      - name: Deploy to Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Substitua por 'build' se for um projeto React antigo
          branch: gh-pages # A branch onde os arquivos compilados serão salvos
